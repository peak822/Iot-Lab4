# ══════════════════════════════════════════════════════════
# ESPHome BTHome v2 Gateway Configuration — bthome-999.yaml
# ══════════════════════════════════════════════════════════
# Target Device: ESP32 (KinCony KC868-A6 / ESP32 Generic)
# Protocol: BTHome v2 (Unencrypted Advertisements)
# Sensors: 8x Xiaomi Mijia LYWSD03MMC (Flashed with PVVX/ATC BTHome v2 Firmware)
#
# ⚠️ ข้อกำหนดสำคัญ:
# 1. เซนเซอร์ Mijia LYWSD03MMC ต้องแฟลช Custom Firmware (PVVX / ATC) 
#    และตั้งค่าโหมด Advertisement เป็น "BTHome v2 (Unencrypted)"
# 2. ไฟล์นี้ไม่ต้องใส่ Xiaomi MiBeacon Bindkey ใด ๆ ทั้งสิ้น
# 3. ส่งข้อมูลออก MQTT Topic: pkru/104-106-110-119/<MAC>/data ในรูปแบบ JSON
# ══════════════════════════════════════════════════════════

substitutions:
  name: "bthome-999"
  friendly_name: "BTHome v2 Telemetry Gateway"
  mqtt_topic_prefix: "pkru/104-106-110-119"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "BTHome v2 unencrypted telemetry gateway for 8 Mijia sensors"
  project:
    name: "pkru.bthome-telemetry"
    version: "2.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# --- System Logger ---
logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    bthome_sensor: DEBUG
    mqtt.component: INFO

# --- Network Configuration ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "BTHome-999-Fallback"
    password: !secret ota_password

captive_portal:

# --- Time Synchronization for ISO8601 Timestamps ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"

# --- ESPHome API & OTA ---
api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- MQTT Client Configuration ---
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  keepalive: 60s
  discovery: true
  birth_message:
    topic: ${mqtt_topic_prefix}/status
    payload: "online"
    qos: 1
    retain: true
  will_message:
    topic: ${mqtt_topic_prefix}/status
    payload: "offline"
    qos: 1
    retain: true

# --- Singleton BLE Tracker ---
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: false

# ══════════════════════════════════════════════════════════
# C++ Helper: Format & Publish JSON Payload to MQTT
# ══════════════════════════════════════════════════════════
# Function publish_bthome_json()
# - Formats ISO8601 datetime timestamp (YYYY-MM-DDTHH:MM:SS+0700)
# - Validates NaN values and outputs null for unavailable metrics
# - Logs in format: BTHome #XX MAC=... RSSI=... Temperature=... Humidity=... Battery=...
# - Publishes JSON payload to topic: pkru/104-106-110-119/<MAC>/data
# ══════════════════════════════════════════════════════════

# --- Sensors (8x BTHome v2 Channels) ---
sensor:
  # ═════════════════════════════════════════
  # BTHome Sensor #01 (MAC: A4:C1:38:00:00:01)
  # ═════════════════════════════════════════
  - platform: bthome_sensor
    mac_address: "A4:C1:38:00:00:01"
    temperature:
      name: "BTHome 01 Temperature"
      id: bthome_01_temp
      on_value:
        then:
          - lambda: |-
              int dev_no = 1;
              const char* mac_str = "A4:C1:38:00:00:01";
              float temp = id(bthome_01_temp).state;
              float hum = id(bthome_01_hum).state;
              float bat = id(bthome_01_bat).state;
              float rssi = id(bthome_01_rssi).state;
              
              ESP_LOGI("BTHome", "BTHome #%02d MAC=%s RSSI=%.0f Temperature=%.2f C Humidity=%.2f %% Battery=%.0f%%",
                       dev_no, mac_str, rssi, temp, hum, bat);

              char time_str[32];
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                now.strftime(time_str, sizeof(time_str), "%Y-%m-%dT%H:%M:%S+0700");
              } else {
                snprintf(time_str, sizeof(time_str), "null");
              }

              char payload[256];
              snprintf(payload, sizeof(payload),
                "{\"device_no\":%d,\"mac\":\"%s\",\"protocol\":\"BTHome_v2\",\"rssi\":%s,\"encrypted\":false,\"available\":true,\"temperature_c\":%s,\"humidity_percent\":%s,\"battery_percent\":%s,\"datetime\":\"%s\"}",
                dev_no, mac_str,
                isnan(rssi) ? "null" : String((int)rssi).c_str(),
                isnan(temp) ? "null" : String(temp, 1).c_str(),
                isnan(hum) ? "null" : String(hum, 1).c_str(),
                isnan(bat) ? "null" : String((int)bat).c_str(),
                time_str
              );
              id(mqtt_client).publish("pkru/104-106-110-119/A4:C1:38:00:00:01/data", payload, 0, false);
    humidity:
      name: "BTHome 01 Humidity"
      id: bthome_01_hum
    battery_level:
      name: "BTHome 01 Battery"
      id: bthome_01_bat

  - platform: ble_rssi
    mac_address: "A4:C1:38:00:00:01"
    name: "BTHome 01 RSSI"
    id: bthome_01_rssi

