# ══════════════════════════════════════════════════════════
# Mijia Sensor Definitions — 8 ตัว + RSSI
# ══════════════════════════════════════════════════════════
# ⚠️ เปลี่ยน MAC Address ให้ตรงกับอุปกรณ์จริง (ใช้ค่าจาก Phase 1 BLE Discovery)
# ⚠️ เปลี่ยน platform ให้ตรงกับรุ่น Mijia จริง:
#    - xiaomi_lywsdcgq    → Mijia Temperature/Humidity Sensor (จอ LCD ใหญ่ กลม)
#    - xiaomi_lywsd03mmc  → Mijia Temperature/Humidity Monitor 2 (สี่เหลี่ยม จอเล็ก)
#    - xiaomi_cgdk2       → Qingping Temp & RH Monitor Lite
# ⚠️ หากรุ่นที่ใช้ต้องการ bindkey ให้เปลี่ยน bindkey ของแต่ละ entry ด้วย
# ⚠️ ห้ามประกาศ esp32_ble_tracker: ในไฟล์นี้ (ประกาศแล้วใน ble.yaml)
# ══════════════════════════════════════════════════════════

sensor:
  # ═══════════════════════════════════════
  # Mijia #01
  # ═══════════════════════════════════════
  - platform: xiaomi_lywsd03mmc    # ⚠️ เปลี่ยนตามรุ่นจริง
    mac_address: "A4:C1:38:00:00:01"    # ⚠️ เปลี่ยนเป็น MAC จริง
    bindkey: "00000000000000000000000000000001"    # ⚠️ เปลี่ยนเป็น bindkey จริง (จำเป็นสำหรับ LYWSD03MMC)
    temperature:
      name: "Mijia 01 Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Mijia 01 Humidity"
      accuracy_decimals: 1
    battery_level:
      name: "Mijia 01 Battery"

