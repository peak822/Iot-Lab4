# ══════════════════════════════════════════════════════════
# BLE Tracker Configuration — KC868-A6
# ══════════════════════════════════════════════════════════
# ⚠️ SINGLETON: ประกาศ esp32_ble_tracker: ที่นี่ที่เดียวเท่านั้น
# ห้ามประกาศซ้ำในไฟล์อื่น (sensors.yaml, mqtt.yaml ฯลฯ)
# เพราะ ESPHome จะ compile ไม่ผ่านหากมีการประกาศซ้ำ
# ══════════════════════════════════════════════════════════

esp32_ble_tracker:
  scan_parameters:
    # interval: ระยะเวลาระหว่างแต่ละรอบการสแกน
    # window: ระยะเวลาที่ใช้ฟัง BLE advertisement ในแต่ละรอบ
    # ตั้ง interval = window = 1100ms เพื่อให้สแกนต่อเนื่อง (continuous scan)
    # เหมาะสำหรับ 8 sensors — ลดโอกาสพลาด advertisement
    interval: 1100ms
    window: 1100ms
    active: true
