# ══════════════════════════════════════════════════════════
# Mosquitto Configuration Sample for KC868-A6 + Web Dashboard
# ══════════════════════════════════════════════════════════
# ไฟล์ตัวอย่างคอนฟิกสำหรับ Eclipse Mosquitto MQTT Broker
# รองรับทั้ง ESPHome (Port 1883) และ Web Dashboard (Port 9001 WebSocket)
#
# วิธีใช้งานบน Windows:
#   1. ติดตั้ง Mosquitto จาก https://mosquitto.org/download/
#   2. บันทึกไฟล์นี้เป็น mosquitto.conf ในโฟลเดอร์ที่ติดตั้ง (เช่น C:\Program Files\mosquitto\mosquitto.conf)
#   3. รันคำสั่ง: mosquitto -c mosquitto.conf -v
#
# วิธีใช้งานบน Linux / Raspberry Pi:
#   1. sudo cp mosquitto_sample.conf /etc/mosquitto/conf.d/kc868.conf
#   2. sudo systemctl restart mosquitto
# ══════════════════════════════════════════════════════════

# --- General Settings ---
allow_anonymous true
persistence true
persistence_location mosquitto_data/

# --- Port 1: Standard MQTT (สำหรับ ESP32 / KC868-A6 / Home Assistant) ---
listener 1883 0.0.0.0
protocol mqtt

# --- Port 2: WebSocket (สำหรับ Web Dashboard ในเบราว์เซอร์) ---
listener 9001 0.0.0.0
protocol websockets

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
